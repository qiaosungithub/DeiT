# Phase 2 Run AG: tiny-bit MLP K160 + low augmentation/reg + corrected mixup/cutmix soft_top2
# Purpose: follow up AB, the current best K80 low-aug mix/cut run, to test whether larger K helps once mix/cut labels are corrected.
# No warm-start, no aux CE, no CE shortcut.

model: ViT_base_mdh_mlp

dataset:
    num_workers: 16
    prefetch_factor: 4

    use_rand_augment: false
    rand_augment: rand-m9-mstd0.5-inc1
    reprob: 0.0

    use_mixup_cutmix: true
    mixup_prob: 1.0
    switch_prob: 0.5
    mixup_alpha: 0.8
    cutmix_alpha: 1.0

    repeated_aug: 1
    label_smoothing: 0.1
    num_tpus: 8

batch_size: 1024
learning_rate: 0.0005
num_epochs: 330
log_per_step: 100

optimizer: adamw
weight_decay: 0.02
adamw_b2: 0.95
dropout_rate: 0.0
stochastic_depth_rate: 0.05
grad_norm_clip: null

use_diffusion_head: true
head_type: mlp
head_bit_dim: 8
head_mlp_hidden_dim: 3072
head_mlp_activation: gelu
head_n_layers: 2
mask_schedule: uniform
diffusion_label_mode: soft_top2
eval_iter_steps: 4
n_masks_per_image: 160
head_aux_ce: false
aux_ce_loss_weight: 0.0

logging:
    use_wandb: True
    wandb_project: 'deit'
    wandb_entity: 'sqa24-massachusetts-institute-of-technology'
    wandb_notes: 'deit phase2 Run AG: MLP K160 low-aug + corrected mixup/cutmix soft_top2; no CE shortcut'
    wandb_tags:
        - sqa
        - phase2
        - mlp-head
        - tiny-bit
        - k160
        - low-aug
        - mixup-cutmix-soft-top2
        - no-ce-shortcut
