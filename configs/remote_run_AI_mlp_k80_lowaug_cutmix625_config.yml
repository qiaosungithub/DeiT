# Phase 2 Run AI: tiny-bit MLP K80 + low augmentation/reg + corrected cutmix-interpolation soft_top2
# Purpose: AB p=0.5 is best mature; AH p=0.75 was better early but slightly worse by ep159; AF p=1.0 is dominated.
# This tests the interpolation point p=0.625 while keeping all AB/AH hyperparameters fixed.
# No warm-start, no load_backbone_from, no aux CE, no CE shortcut.

model: ViT_base_mdh_mlp
load_from: ''
load_backbone_from: ''

dataset:
    num_workers: 16
    prefetch_factor: 4

    use_rand_augment: false
    rand_augment: rand-m9-mstd0.5-inc1
    reprob: 0.0

    use_mixup_cutmix: true
    mixup_prob: 1.0
    switch_prob: 0.625
    mixup_alpha: 0.8
    cutmix_alpha: 1.0

    repeated_aug: 1
    label_smoothing: 0.1
    num_tpus: 8

batch_size: 1024
learning_rate: 0.0005
num_epochs: 330
log_per_step: 100

optimizer: adamw
weight_decay: 0.02
adamw_b2: 0.95
dropout_rate: 0.0
stochastic_depth_rate: 0.05
grad_norm_clip: null

use_diffusion_head: true
head_type: mlp
head_bit_dim: 8
head_mlp_hidden_dim: 3072
head_mlp_activation: gelu
head_mlp_layer_norm: false
head_n_layers: 2
mask_schedule: uniform
diffusion_label_mode: soft_top2
eval_iter_steps: 4
n_masks_per_image: 80
head_aux_ce: false
aux_ce_loss_weight: 0.0

logging:
    use_wandb: True
    wandb_project: 'deit'
    wandb_entity: 'sqa24-massachusetts-institute-of-technology'
    wandb_notes: 'deit phase2 Run AI: MLP K80 low-aug + corrected cutmix/mixup p=0.625 soft_top2; no CE shortcut'
    wandb_tags:
        - sqa
        - phase2
        - mlp-head
        - tiny-bit
        - k80
        - low-aug
        - cutmix625-soft-top2
        - no-ce-shortcut
