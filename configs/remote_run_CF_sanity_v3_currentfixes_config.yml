# Phase 1 Sanity Run CF: v3 architecture with current reference-alignment fixes.
# Purpose: current CE sanity window 6450 (ViT_base_v2, no LayerScale) is far
# below old v3 sanity at matched epochs, so test whether preserving v3/LearnedScale
# restores the old trajectory while keeping exact GELU, AdamW b2=0.999, WD mask,
# label smoothing wiring, and input-pipeline fixes.

model: ViT_base_v3

dataset:
    num_workers: 16
    prefetch_factor: 4

    use_rand_augment: true
    rand_augment: rand-m9-mstd0.5-inc1
    reprob: 0.25

    use_mixup_cutmix: true
    mixup_prob: 1.0
    switch_prob: 0.5
    mixup_alpha: 0.8
    cutmix_alpha: 1.0

    repeated_aug: 3
    label_smoothing: 0.1
    num_tpus: 8

batch_size: 1024
learning_rate: 0.0005
num_epochs: 330
log_per_step: 100

optimizer: adamw
weight_decay: 0.05
adamw_b2: 0.999
label_smoothing: 0.0
dropout_rate: 0.0
stochastic_depth_rate: 0.1
grad_norm_clip: null

logging:
    use_wandb: True
    wandb_project: 'deit'
    wandb_entity: 'sqa24-massachusetts-institute-of-technology'
    wandb_notes: 'sanity-run CF: ViT_base_v3 + current exact-GELU/b2/input fixes; no warm-start; target reproduce old v3 sanity then DeiT ref'
    wandb_tags:
        - sqa
        - phase1-sanity
        - v3-layerscale
        - b2-0.999
        - no-warm-start
