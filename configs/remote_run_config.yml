# Mirrors the legacy launch shell (DeiT ViT-base, ImageNet, TPU).
# Original: batch=1024 lr=5e-4 ep=330 wd=0.05 label_smoothing=0.1
#           rand-aug + repeated-aug=3 + mixup/cutmix + stoch-depth=0.1

model: ViT_base

dataset:
    num_workers: 16
    prefetch_factor: 4

    # rand-augment / random erasing
    use_rand_augment: true
    rand_augment: rand-m9-mstd0.5-inc1
    reprob: 0.25

    # mixup / cutmix
    use_mixup_cutmix: true
    mixup_prob: 1.0
    switch_prob: 0.5
    mixup_alpha: 0.8
    cutmix_alpha: 1.0

    repeated_aug: 3
    label_smoothing: 0.1
    num_tpus: 32

batch_size: 1024
learning_rate: 0.0005
num_epochs: 330        # with repeated-aug=3, ~= 110 effective epochs + 10 cooldown
log_per_step: 20

optimizer: adamw
weight_decay: 0.05
dropout_rate: 0.0
stochastic_depth_rate: 0.1
grad_norm_clip: null

logging:
    use_wandb: True
    wandb_project: 'deit'
    wandb_entity: 'sqa24-massachusetts-institute-of-technology'
    wandb_tags:
        - sqa
        - deit
        - vit-base
    wandb_notes: "deit baseline (ViT-base, b1024, lr5e-4, ep330)"
