# Phase 2 Run D: masked diffusion head, no mixup (fix), logit-normal mask schedule
# logit-normal: t = sigmoid(z*2), z~N(0,1) — concentrates mask ratio near 0.5
# vs Run C which uses uniform t

model: ViT_base_mdh

dataset:
    num_workers: 16
    prefetch_factor: 4

    use_rand_augment: true
    rand_augment: rand-m9-mstd0.5-inc1
    reprob: 0.25

    use_mixup_cutmix: true
    mixup_prob: 1.0
    switch_prob: 0.5
    mixup_alpha: 0.8
    cutmix_alpha: 1.0

    repeated_aug: 3
    label_smoothing: 0.1
    num_tpus: 8

batch_size: 1024
learning_rate: 0.0005
num_epochs: 330
log_per_step: 100

optimizer: adamw
weight_decay: 0.05
adamw_b2: 0.95
dropout_rate: 0.0
stochastic_depth_rate: 0.1
grad_norm_clip: null

use_diffusion_head: true
head_inner_dim: 256
head_n_layers: 2
head_n_heads: 4
mask_schedule: logit_normal
eval_iter_steps: 4

logging:
    use_wandb: True
    wandb_project: 'deit'
    wandb_entity: 'sqa24-massachusetts-institute-of-technology'
    wandb_tags:
        - sqa
        - deit
        - phase2
        - masked-diffusion
    wandb_notes: "phase2-mdh-no-mixup-logit-normal-D"
