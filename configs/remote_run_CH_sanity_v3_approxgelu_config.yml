# Run CH: CE sanity ablation, current code + old Flax approximate GELU.
# Purpose: isolate whether switching backbone MLP GELU from approximate=True
# to exact GELU caused the CF sanity regression. Fresh CE run; no warm-start.

model: ViT_base_v3
load_from: ''
load_backbone_from: ''
gelu_approximate: true

dataset:
    num_workers: 16
    prefetch_factor: 4

    use_rand_augment: true
    rand_augment: rand-m9-mstd0.5-inc1
    reprob: 0.25

    use_mixup_cutmix: true
    pre_mixup_shuffle: false
    mixup_prob: 1.0
    switch_prob: 0.5
    mixup_alpha: 0.8
    cutmix_alpha: 1.0

    repeated_aug: 3
    label_smoothing: 0.1
    num_tpus: 8

batch_size: 1024
learning_rate: 0.0005
num_epochs: 330
log_per_step: 100

optimizer: adamw
weight_decay: 0.05
adamw_b2: 0.999
label_smoothing: 0.0
dropout_rate: 0.0
stochastic_depth_rate: 0.1
grad_norm_clip: null

logging:
    use_wandb: True
    wandb_project: 'deit'
    wandb_entity: 'sqa24-massachusetts-institute-of-technology'
    wandb_notes: 'sanity-run CH: ViT_base_v3 current code + approximate GELU; no pre-mixup shuffle; no warm-start'
    wandb_tags:
        - sqa
        - phase1-sanity
        - v3-layerscale
        - approximate-gelu
        - b2-0.999
        - no-warm-start
