# Phase 2 Run J: low-augmentation / low-regularization (mild)
# Purpose: speed up diffusion convergence by reducing training noise.

model: ViT_base_mdh

dataset:
    num_workers: 16
    prefetch_factor: 4

    use_rand_augment: false
    rand_augment: rand-m9-mstd0.5-inc1
    reprob: 0.0

    use_mixup_cutmix: false
    mixup_prob: 1.0
    switch_prob: 0.5
    mixup_alpha: 0.8
    cutmix_alpha: 1.0

    repeated_aug: 1
    label_smoothing: 0.1
    num_tpus: 8

batch_size: 1024
learning_rate: 0.0005
num_epochs: 330
log_per_step: 100

optimizer: adamw
weight_decay: 0.02
adamw_b2: 0.95
dropout_rate: 0.0
stochastic_depth_rate: 0.05
grad_norm_clip: null

use_diffusion_head: true
head_type: attention
head_inner_dim: 256
head_n_layers: 2
head_n_heads: 4
head_aux_ce: false
mask_schedule: uniform
eval_iter_steps: 4

logging:
    use_wandb: True
    wandb_project: 'deit'
    wandb_entity: 'sqa24-massachusetts-institute-of-technology'
    wandb_notes: 'phase2 Run J: low-aug/low-reg mild (no RA, reprob0, repeated_aug1, wd0.02, sd0.05), pure diffusion baseline'
    wandb_tags:
        - sqa
        - phase2
        - low-aug
        - low-reg
